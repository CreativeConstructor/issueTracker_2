{% extends 'base.html' %}
{% load static %}

{% block content %}
<div style="display: flex; justify-content: center; margin-top: 50px;">
    <div class="glass-panel" style="padding: 40px; width: 100%; max-width: 400px;">
        <h2 style="margin-bottom: 20px; text-align: center;">Create Account</h2>
        
        <form id="register-form">
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; color: var(--text-secondary);">Username</label>
                <input type="text" id="username" class="form-input" required>
            </div>
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; color: var(--text-secondary);">Password</label>
                <input type="password" id="password" class="form-input" required>
            </div>
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; color: var(--text-secondary);">Confirm Password</label>
                <input type="password" id="password_confirm" class="form-input" required>
            </div>
            <input type="hidden" id="role" value="citizen">
            
            <button type="submit" class="btn-primary" style="width: 100%; height: 50px;">Create Account</button>
        </form>
        
        <p style="text-align: center; margin-top: 25px; font-size: 0.9em; color: var(--text-secondary);">
            Are you an official? <a href="{% url 'register_gov' %}" style="color: var(--brand-primary); text-decoration: none;">Government Official Signup</a>
        </p>
        
        <p style="text-align: center; margin-top: 20px; color: var(--text-secondary);">
            Already have an account? <a href="{% url 'login' %}" style="color: var(--brand-primary);">Sign In</a>
        </p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{% static 'js/register.js' %}"></script>
{% endblock %}
