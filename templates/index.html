{% extends 'base.html' %}
{% load static %}


{% block content %}
<div class="glass-panel" style="padding: 40px; text-align: center;">
    <h1 class="text-gradient">Public Issue Feed</h1>
    <p style="color: var(--text-secondary); margin-top: 10px;">
        See what's happening in your local community.
    </p>
</div>

<div id="status-tabs" style="margin-top: 30px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
    <button class="tab-btn btn-primary" data-target="all" onclick="changeTab('all')">All Issues</button>
    <button class="tab-btn btn-primary" data-target="pending" onclick="changeTab('pending')" style="background: var(--bg-glass); box-shadow: none;">Pending</button>
    <button class="tab-btn btn-primary" data-target="in_progress" onclick="changeTab('in_progress')" style="background: var(--bg-glass); box-shadow: none;">In Progress</button>
    <button class="tab-btn btn-primary" data-target="done" onclick="changeTab('done')" style="background: var(--bg-glass); box-shadow: none;">Done</button>
</div>

<div id="tab-content" style="margin-top: 30px;">
    <!-- Filtered issues will be loaded here -->
</div>

<div id="issue-list" style="display: none;">
    <!-- Hidden original list to maintain compatibility or for initial load -->
</div>
{% endblock %}

{% block scripts %}
<script src="{% static 'js/feed.js' %}"></script>
{% endblock scripts %}
