apiVersion: v1
kind: Service
metadata:
  name: db-service
spec:
  selector:
    app: db
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: issue-tracker-service
spec:
  selector:
    app: issue-tracker
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: LoadBalancer
